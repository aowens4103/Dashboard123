  note: >
    Cap-weighted exposure is already the default holding, so this thesis
    mostly argues against a tactical move to equal-weight. Gating it means
    sizing that decision explicitly rather than by inertia.
horizon: 2027-06-30
review: 2026-10-20
authors_doubt: >
  NVIDIA alone is roughly 65 percent of the Magnificent 7 growth rate, so this
  is far less a story about seven companies than the framing suggests. Strip
  NVIDIA and the Mag 6 grow 14.8 percent against 12.1 for the 493, a gap too
  narrow to justify the concentration on these grounds.
